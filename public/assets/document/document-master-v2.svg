<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188">
  <defs>
    <linearGradient id="paper-v2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/>
      <stop offset="0.58" stop-color="#F6F2E9"/>
      <stop offset="1" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="header-wash-v2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- A4 paper. All details stay inside a 64 px safe area so the 40x40 WebGL mosaic cannot clip them. -->
  <rect width="840" height="1188" fill="url(#paper-v2)"/>
  <rect x="3" y="3" width="834" height="1182" rx="3" fill="none" stroke="#D6D0C4" stroke-width="6"/>
  <rect x="6" y="6" width="828" height="260" fill="url(#header-wash-v2)"/>

  <!-- Header: fewer, heavier shapes remain legible when one cell becomes one mini-document. -->
  <g>
    <rect x="64" y="64" width="292" height="30" rx="5" fill="#041E42"/>
    <rect x="64" y="116" width="356" height="14" rx="4" fill="#929B9A"/>
    <rect x="64" y="146" width="292" height="12" rx="4" fill="#B0B5B2"/>
    <rect x="64" y="174" width="326" height="12" rx="4" fill="#B0B5B2"/>

    <rect x="612" y="60" width="164" height="196" rx="8" fill="#ECE8DE" stroke="#788486" stroke-width="8"/>
    <rect x="630" y="78" width="128" height="160" rx="3" fill="#F8F5EE" stroke="#C8CBC6" stroke-width="5"/>
  </g>

  <rect x="64" y="286" width="712" height="9" rx="4.5" fill="#D6BE93"/>

  <!-- Personal data. -->
  <g>
    <rect x="64" y="334" width="176" height="22" rx="4" fill="#041E42" fill-opacity="0.92"/>
    <rect x="64" y="378" width="712" height="7" rx="3.5" fill="#C7C8C2"/>

    <g data-form-ink="true"><rect x="64" y="410" width="312" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="64" y="445" width="312" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
    <g data-form-ink="true"><rect x="432" y="410" width="268" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="432" y="445" width="344" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
  </g>

  <!-- Contact data. -->
  <g>
    <rect x="64" y="496" width="176" height="22" rx="4" fill="#041E42" fill-opacity="0.92"/>
    <rect x="64" y="540" width="712" height="7" rx="3.5" fill="#C7C8C2"/>

    <g data-form-ink="true"><rect x="64" y="572" width="258" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="64" y="607" width="312" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
    <g data-form-ink="true"><rect x="432" y="572" width="304" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="432" y="607" width="344" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
  </g>

  <!-- Review data. -->
  <g>
    <rect x="64" y="658" width="176" height="22" rx="4" fill="#041E42" fill-opacity="0.92"/>
    <rect x="64" y="702" width="712" height="7" rx="3.5" fill="#C7C8C2"/>

    <g data-form-ink="true"><rect x="64" y="734" width="312" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="64" y="769" width="312" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
    <g data-form-ink="true"><rect x="432" y="734" width="268" height="16" rx="4" fill="#9EA6A4"/></g>
    <rect x="432" y="769" width="344" height="7" rx="3.5" fill="#657477" fill-opacity="0.62"/>
  </g>

  <!-- Options: the stronger outlines and one selected item give the mosaic a clear visual rhythm. -->
  <g>
    <rect x="64" y="818" width="196" height="22" rx="4" fill="#041E42" fill-opacity="0.92"/>
    <rect x="64" y="864" width="28" height="28" rx="4" fill="#F8F5EE" stroke="#657477" stroke-width="7"/>
    <g data-form-ink="true"><path d="M72 878l7 7 14-18" fill="none" stroke="#041E42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <rect x="116" y="870" width="212" height="16" rx="4" fill="#A6ADAA"/>
    <rect x="432" y="864" width="28" height="28" rx="4" fill="#F8F5EE" stroke="#657477" stroke-width="7"/>
    <rect x="484" y="870" width="228" height="16" rx="4" fill="#A6ADAA"/>

    <rect x="64" y="916" width="28" height="28" rx="4" fill="#F8F5EE" stroke="#657477" stroke-width="7"/>
    <rect x="116" y="922" width="244" height="16" rx="4" fill="#A6ADAA"/>
    <rect x="432" y="916" width="28" height="28" rx="4" fill="#F8F5EE" stroke="#657477" stroke-width="7"/>
    <rect x="484" y="922" width="168" height="16" rx="4" fill="#A6ADAA"/>
  </g>

  <rect x="64" y="976" width="712" height="8" rx="4" fill="#D6BE93"/>

  <!-- Approval area. Stamp target center maps to WebGL anchor (1.16, -2.40). -->
  <g>
    <rect x="64" y="1018" width="170" height="20" rx="4" fill="#041E42" fill-opacity="0.92"/>
    <path d="M64 1096H424" fill="none" stroke="#657477" stroke-width="8" stroke-linecap="round"/>
    <path d="M64 1124H268" fill="none" stroke="#B9BDB8" stroke-width="7" stroke-linecap="round"/>

    <circle cx="650" cy="1068" r="92" fill="#F8F5EE" fill-opacity="0.28" stroke="#788486" stroke-width="10"/>
    <circle cx="650" cy="1068" r="72" fill="none" stroke="#B8BDB8" stroke-width="6"/>
  </g>

  <path d="M64 1158H776" fill="none" stroke="#CFD0CA" stroke-width="5" stroke-linecap="round"/>
</svg>
